<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Management System</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #1f2937;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 10px;
    }

    header p {
      margin: 0;
      color: #d1d5db;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      margin-bottom: 25px;
    }

    h2 {
      margin-top: 0;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      margin-top: 5px;
      padding: 12px 20px;
      border: none;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 7px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th {
      background: #374151;
      color: white;
      padding: 13px;
      text-align: left;
    }

    td {
      padding: 13px;
      border-bottom: 1px solid #e5e7eb;
    }

    tr:hover {
      background: #f9fafb;
    }

    #loading {
      color: #6b7280;
    }

    .count {
      margin-top: 15px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #6b7280;
    }

    @media (max-width: 650px) {
      .card {
        padding: 20px;
        overflow-x: auto;
      }

      table {
        min-width: 550px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Student Management System</h1>
    <p>Manage students using Netlify Database</p>
  </header>

  <main class="container">

    <!-- Add Student -->
    <div class="card">

      <h2>Add Student</h2>

      <form id="studentForm">

        <div class="form-group">
          <label for="name">Student Name</label>

          <input
            type="text"
            id="name"
            placeholder="Enter student name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email</label>

          <input
            type="email"
            id="email"
            placeholder="Enter student email"
            required
          >
        </div>

        <button id="addButton" type="submit">
          Add Student
        </button>

      </form>

      <div id="message"></div>

    </div>


    <!-- Student List -->
    <div class="card">

      <h2>Student List</h2>

      <p id="loading">
        Loading students...
      </p>

      <table id="studentTable" style="display: none;">

        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
          </tr>
        </thead>

        <tbody id="studentList"></tbody>

      </table>

      <p id="studentCount" class="count"></p>

    </div>

  </main>

  <footer>
    Student Management System &copy; 2026
  </footer>


  <script>

    const form = document.getElementById("studentForm");

    const nameInput = document.getElementById("name");

    const emailInput = document.getElementById("email");

    const addButton = document.getElementById("addButton");

    const message = document.getElementById("message");

    const loading = document.getElementById("loading");

    const table = document.getElementById("studentTable");

    const studentList = document.getElementById("studentList");

    const studentCount = document.getElementById("studentCount");


    // Show message
    function showMessage(text, type) {

      message.textContent = text;

      message.className = type;

      message.style.display = "block";

    }


    // Load students
    async function loadStudents() {

      try {

        const response = await fetch(
          "/.netlify/functions/students"
        );

        if (!response.ok) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }

        const students = await response.json();

        studentList.innerHTML = "";

        students.forEach(student => {

          const row = document.createElement("tr");

          const id = document.createElement("td");

          const name = document.createElement("td");

          const email = document.createElement("td");


          id.textContent = student.id;

          name.textContent = student.name;

          email.textContent = student.email;


          row.appendChild(id);

          row.appendChild(name);

          row.appendChild(email);


          studentList.appendChild(row);

        });


        loading.style.display = "none";

        table.style.display = "table";

        studentCount.textContent =
          `Total Students: ${students.length}`;

      } catch (error) {

        loading.textContent =
          "Error loading students: " + error.message;

        loading.style.color = "red";

      }

    }


    // Add student
    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const name = nameInput.value.trim();

      const email = emailInput.value.trim();


      if (!name || !email) {

        showMessage(
          "Please enter both name and email.",
          "error"
        );

        return;

      }


      addButton.disabled = true;

      addButton.textContent = "Adding...";


      try {

        const response = await fetch(
          "/.netlify/functions/students",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              name: name,
              email: email
            })
          }
        );


        const data = await response.json();


        if (!response.ok) {

          throw new Error(
            data.error || "Failed to add student"
          );

        }


        showMessage(
          "Student added successfully!",
          "success"
        );


        // Clear form
        nameInput.value = "";

        emailInput.value = "";


        // Reload student list
        await loadStudents();


      } catch (error) {

        showMessage(
          "Error: " + error.message,
          "error"
        );

      } finally {

        addButton.disabled = false;

        addButton.textContent = "Add Student";

      }

    });


    // Load students when page opens
    loadStudents();

  </script>

</body>

</html>
