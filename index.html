<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .card h2 {
            margin-bottom: 20px;
        }

        form {
            display: grid;
            gap: 15px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }

        .delete-btn {
            background: #dc2626;
            padding: 7px 12px;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }
    </style>
</head>

<body>

    <header>
        <h1>Student Management System</h1>
        <p>Manage student information easily</p>
    </header>

    <div class="container">

        <div class="card">
            <h2>Add Student</h2>

            <form id="studentForm">
                <input
                    type="text"
                    id="name"
                    placeholder="Student Name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="text"
                    id="course"
                    placeholder="Course"
                    required
                >

                <input
                    type="tel"
                    id="phone"
                    placeholder="Phone Number"
                >

                <button type="submit">Add Student</button>
            </form>
        </div>

        <div class="card">
            <h2>Students</h2>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Phone</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentList">
                </tbody>
            </table>
        </div>

    </div>

    <script>
        const form = document.getElementById("studentForm");
        const studentList = document.getElementById("studentList");

        let students = [];

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const student = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                course: document.getElementById("course").value,
                phone: document.getElementById("phone").value
            };

            students.push(student);

            displayStudents();

            form.reset();
        });

        function displayStudents() {
            studentList.innerHTML = "";

            students.forEach((student, index) => {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${student.name}</td>
                    <td>${student.email}</td>
                    <td>${student.course}</td>
                    <td>${student.phone}</td>
                    <td>
                        <button
                            class="delete-btn"
                            onclick="deleteStudent(${index})">
                            Delete
                        </button>
                    </td>
                `;

                studentList.appendChild(row);
            });
        }

        function deleteStudent(index) {
            students.splice(index, 1);
            displayStudents();
        }
    </script>

</body>
</html>
